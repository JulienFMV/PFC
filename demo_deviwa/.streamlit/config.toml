[theme]
base = "light"
primaryColor = "#0F52CC"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6FB"
textColor = "#0E1F3D"
font = "sans serif"

[server]
headless = false
maxUploadSize = 50

[browser]
gatherUsageStats = false

# Hide the dev-mode chrome (Deploy button + 3-dot menu top-right) for the
# client demo. ``viewer`` keeps the Settings menu (full-width, theme) but
# removes Deploy / Manage / Rerun controls. Use ``minimal`` for a fully
# locked-down read-only client view if needed.
[client]
toolbarMode = "viewer"
showErrorDetails = false
