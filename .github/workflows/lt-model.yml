name: lt-model

on:
  pull_request:
    paths:
      - ".github/workflows/lt-model.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "pfc_shaping/calibration/**"
      - "pfc_shaping/data/**"
      - "pfc_shaping/lt/**"
      - "pfc_shaping/pipeline/**"
      - "pfc_shaping/validation/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lt-model.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "pfc_shaping/calibration/**"
      - "pfc_shaping/data/**"
      - "pfc_shaping/lt/**"
      - "pfc_shaping/pipeline/**"
      - "pfc_shaping/validation/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: lt-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-model-contracts:
    name: Bounded LT model contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select CPython 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install declared test environment
        run: >-
          python -m pip install --disable-pip-version-check
          -e ".[test,validation]"
      - name: Minimum LT and monthly solver contracts
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_arbitrage_free.py \
            tests/test_cascading.py \
            tests/test_water_value.py \
            tests/test_lt_ct_imports.py \
            tests/test_monthly_forward_curve_constraints.py \
            tests/test_monthly_forward_curve_priors.py \
            tests/test_monthly_forward_curve_solver.py \
            tests/test_monthly_forward_curve_integration.py \
            tests/test_monthly_forward_curve_audit.py \
            tests/test_lt_quant_optimizer_kkt.py \
            tests/test_lt_quant_no_leakage.py \
            tests/test_solver_parity_perfect_foresight.py
      - name: Governed data and PIT contracts
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_eex_historical_vintage.py \
            tests/test_lt_input_sources.py \
            tests/test_forward_proxy.py \
            tests/test_quality_gate.py
