version: 1
owner: "Swiss CT"
timezone: "UTC"

datasets:
  ct_price_15min_ch:
    layer: silver
    domain: market_price
    source_system: energy_charts
    local_cache: "pfc_shaping/data/epex_15min.parquet"
    target_table: "market_data.ct_price_15min_ch"
    grain: "15min_normalized"
    time_key: "timestamp_utc"
    freshness_sla_days: 2
    required: true
    consumed_by_prod: true
    source_market_grain: "1h"
    source_market_zone: "CH"
    columns:
      - timestamp_utc
      - price_eur_mwh
      - source_system
      - ingestion_ts_utc

